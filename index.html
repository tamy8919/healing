    <div style={{minHeight:"100vh",background:bgMain,fontFamily:"Georgia,serif",transition:"background .4s"}}>
      <style>{`
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes slideDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
        @keyframes splashFade{0%{opacity:1}80%{opacity:1}100%{opacity:0;pointer-events:none}}
        @keyframes splashFloat{0%{transform:scale(0.5) rotate(-10deg);opacity:0}60%{transform:scale(1.1) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}
        @keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
        button{transition:all .18s}button:hover{filter:brightness(.96)}
        .litem:hover{background:rgba(180,120,180,.13)!important;transform:translateX(3px);cursor:pointer}
        textarea:focus,input:focus{outline:none;box-shadow:0 0 0 2px rgba(89,184,141,.3)}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(89,184,141,.3);border-radius:3px}
        .sugg:hover{background:${dm?"#0a2018":"#f5eef5"}!important;cursor:pointer}
        a:hover{opacity:.82}
      `}</style>

      {/* SPLASH SCREEN */}
      {showSplash && (
        <div style={{
          position:"fixed",inset:0,zIndex:9999,
          background:"linear-gradient(135deg,#e8f8f4,#d0f0e8,#d0ebff)",
          display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
          animation:"splashFade 2.8s ease forwards",
        }}>
          <div style={{animation:"splashFloat .8s ease forwards",marginBottom:20}}>
            <img src="/icon-192.png" style={{height:"120px",width:"auto"}}/>
          </div>
          <div style={{
            fontSize:26,fontWeight:"normal",color:"#626160",letterSpacing:3,
            background:"linear-gradient(90deg,#59B88D,#43D3FF,#3F9FFF,#59B88D)",
            backgroundSize:"200% auto",
            WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",
            animation:"shimmer 2s linear infinite",
          }}>Seele · Körper · Heilung</div>
          <p style={{color:"#59B88D",fontSize:13,marginTop:10,letterSpacing:1}}>Tamara Jost</p>
          <div style={{marginTop:30,display:"flex",gap:8}}>
            {[0,1,2].map(i=>(
              <div key={i} style={{
                width:8,height:8,borderRadius:"50%",background:"#59B88D",
                animation:`float ${1+i*0.3}s ease-in-out infinite`,
                animationDelay:`${i*0.2}s`,
              }}/>
            ))}
          </div>
        </div>
      )}

      <div style={{maxWidth:740,margin:"0 auto",padding:"20px 14px 44px"}}>

        {/* Header */}
        <div style={{textAlign:"center",marginBottom:18,animation:"fadeIn .7s ease"}}>
          {/* Top bar: Dark mode + Language */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            {/* Dark mode toggle */}
            <button onClick={()=>setDarkMode(!dm)} style={{
              padding:"5px 12px",borderRadius:20,border:`1px solid ${bdr}`,
              background:dm?"#0a2018":"white",color:dm?"#a0ffd8":soft,
              fontSize:13,cursor:"pointer",fontFamily:"inherit",
            }}>{dm?"☀️ Hell":"🌙 Dunkel"}</button>

            {/* Language switcher */}
            <div style={{display:"flex",gap:5}}>
              {["de","it"].map(l=>(
                <button key={l} onClick={()=>switchLang(l)} style={{
                  padding:"4px 12px",borderRadius:20,border:"1.5px solid",
                  borderColor:lang===l?"#c49bc4":bdr,
                  background:lang===l?grad:"transparent",
                  color:lang===l?"white":soft,fontSize:12,cursor:"pointer",fontFamily:"inherit",
                  fontWeight:lang===l?"bold":"normal",
                }}>{l==="de"?"🇩🇪 DE":"🇮🇹 IT"}</button>
              ))}
            </div>
          </div>

          {/* Logo / Title */}
          <div style={{animation:"float 4s ease-in-out infinite",marginBottom:8}}>
            <img src="/icon-192.png"
              alt="Tamara Jost"
              style={{height:"90px",width:"auto",transition:"filter .4s"}}
            />
          </div>
          <h1 style={{fontSize:20,fontWeight:"normal",color:textC,letterSpacing:2.5,margin:"5px 0 2px"}}>{t.titleReal}</h1>
          <p style={{color:soft,fontSize:10.5,margin:0,letterSpacing:.7}}>{t.subtitleReal}</p>
          <div style={{width:50,height:1,background:"linear-gradient(90deg,transparent,#59B88D,transparent)",margin:"7px auto 0"}}/>
          <div style={{marginTop:7,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
            <span style={{fontSize:10.5,color:soft}}>{t.projectOf}</span>
            <a href="https://www.tamarajost.com" target="_blank" rel="noopener noreferrer"
              style={{fontSize:11.5,color:textC,fontWeight:"bold",textDecoration:"none",borderBottom:"1px dotted #59B88D"}}>
              Tamara Jost
            </a>
          </div>

          {/* Daily Affirmation */}
          <div style={{
            marginTop:14,padding:"12px 18px",
            background:dm?"rgba(20,60,40,0.4)":"linear-gradient(135deg,rgba(89,184,141,.1),rgba(67,211,255,.1))",
            borderRadius:14,border:`1px solid ${dm?"#0a3020":"rgba(89,184,141,.3)"}`,
            animation:"fadeIn 1s ease .5s both",
          }}>
            <p style={{fontSize:10,color:soft,margin:"0 0 4px",letterSpacing:1}}>
              {lang==="de"?"✨ TAGES-AFFIRMATION":"✨ AFFERMAZIONE DEL GIORNO"}
            </p>
            <p style={{fontSize:13.5,color:textC,margin:0,fontStyle:"italic",lineHeight:1.6}}>
              {todayAffirmation()}
            </p>
          </div>
        </div>

        {/* Tabs */}
        <div style={{display:"flex",gap:5,marginBottom:14,background:"rgba(255,255,255,.5)",borderRadius:13,padding:5}}>
          {[{id:"search",label:t.tab1},{id:"lexicon",label:t.tab2},{id:"chat",label:t.tab3},{id:"moon",label:t.tab4},{id:"body",label:t.tab5}].map(tab=>(
            <button key={tab.id} onClick={()=>setActiveTab(tab.id)} style={{
              flex:1,padding:"9px 5px",border:"none",borderRadius:9,cursor:"pointer",
              background:activeTab===tab.id?grad:"transparent",
              color:activeTab===tab.id?"white":soft,
              fontSize:11.5,fontFamily:"inherit",fontWeight:activeTab===tab.id?"bold":"normal",

        </div>

        {/* ═══ SEARCH ═══ */}
        {activeTab==="search" && (
          <div style={{animation:"fadeIn .4s ease"}}>

            <div style={{background:card,borderRadius:17,padding:18,marginBottom:13,boxShadow:"0 3px 18px rgba(160,100,160,.09)"}}>

                {t.defaultHint} <strong style={{color:textC}}>{t.defaultHint2}</strong> {t.defaultHint3} <strong style={{color:textC}}>{t.defaultHint4}</strong>.<br/>
                {t.defaultHint5}
              </p>

              <SourcePanel/>

              <textarea value={symptom} onChange={e=>setSymptom(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&(e.preventDefault(),analyzeSymptom())}

                style={{width:"100%",minHeight:78,padding:"11px 14px",border:`1.5px solid ${bdr}`,borderRadius:12,

            {result && (
              <div style={{background:card,borderRadius:17,padding:22,
                boxShadow:"0 3px 18px rgba(160,100,160,.09)",animation:"fadeIn .5s ease",
                borderLeft:"3px solid #59B88D"}}>
                {fmt(result)}
                {user && (
                  <div style={{marginTop:16,paddingTop:14,borderTop:"1px solid rgba(89,184,141,.2)"}}>
                    <p style={{color:"#59B88D",fontSize:11.5,margin:"0 0 8px",fontWeight:"bold"}}>
                      {lang==="it" ? "📝 Nota personale:" : "📝 Persönliche Notiz:"}
                    </p>
                    <textarea value={saveNote} onChange={function(e){setSaveNote(e.target.value);}}
                      placeholder={lang==="it" ? "La tua riflessione..." : "Deine Gedanken..."}
                      rows={2} style={{width:"100%",padding:"9px 12px",border:"1.5px solid #b8e8d8",borderRadius:10,background:"white",color:"#626160",fontSize:12.5,fontFamily:"inherit",resize:"vertical",boxSizing:"border-box",marginBottom:8}}/>
                    <button onClick={function(){saveAnalysis(symptom, result);}} style={{width:"100%",padding:"10px",background:saveSuccess?"#4CAF50":"linear-gradient(135deg,#59B88D,#3F9FFF)",border:"none",borderRadius:11,color:"white",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
                      {saveSuccess ? "✅ "+ (lang==="it"?"Salvato!":"Gespeichert!") : "💾 "+ (lang==="it"?"Salva":"In Mein Bereich speichern")}
                    </button>
                  </div>
                )}
                <TamaraBox lang={lang}/>
              </div>
            )}
          </div>
        )}

        {/* ═══ LEXICON ═══ */}
        {activeTab==="lexicon" && (
          <div style={{animation:"fadeIn .4s ease"}}>
            <FavBar/>
            <div style={{background:card,borderRadius:17,padding:17,marginBottom:13,boxShadow:"0 3px 18px rgba(160,100,160,.09)"}}>
              <p style={{color:soft,fontSize:11.5,margin:"0 0 10px",fontStyle:"italic"}}>
                {t.lexiconHint}<br/>{t.lexiconHint2}
              </p>
              <SourcePanel/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginTop:10}}>
                {LEXICON_TOPICS.map(topic=>(
                  <button key={topic} className="litem" onClick={()=>loadLexicon(topic)} style={{
                    padding:"9px 12px",border:`1.5px solid`,
                    borderColor:selectedLexicon===topic?"#59B88D":bdr,
                    borderRadius:10,background:selectedLexicon===topic?"rgba(180,120,180,.1)":"white",
                    color:"#5a3a5a",fontSize:12.5,textAlign:"left",fontFamily:"inherit",
                  }}>{topic}</button>
                ))}
              </div>
            </div>
            {lexiconLoading && (
              <div style={{textAlign:"center",padding:32,color:soft}}>
                <div style={{fontSize:28,animation:"spin 2s linear infinite",display:"inline-block"}}>🌸</div>
                <p style={{marginTop:9,fontSize:12.5}}>{t.lexiconLoading}</p>
              </div>
            )}
            {lexiconResult && !lexiconLoading && (
              <div style={{background:card,borderRadius:17,padding:22,
                boxShadow:"0 3px 18px rgba(160,100,160,.09)",animation:"fadeIn .5s ease",
                borderLeft:"3px solid #3F9FFF"}}>
                {fmt(lexiconResult)}
                <TamaraBox lang={lang}/>
              </div>
            )}
          </div>
        )}

        {/* ═══ CHAT ═══ */}
        {activeTab==="chat" && (
          <div style={{animation:"fadeIn .4s ease"}}>
            <div style={{background:card,borderRadius:17,boxShadow:"0 3px 18px rgba(160,100,160,.09)",overflow:"hidden"}}>
              <div style={{height:390,overflowY:"auto",padding:17}}>
                {chatMessages.map((msg,i)=>(
                  <div key={i} style={{display:"flex",justifyContent:msg.role==="user"?"flex-end":"flex-start",
                    marginBottom:11,animation:"fadeIn .3s ease"}}>
                    {msg.role==="assistant"&&<div style={{fontSize:17,marginRight:6,marginTop:4,flexShrink:0}}><img src="/icon-192.png" style={{height:"22px",width:"22px",objectFit:"contain"}}/></div>}
                    <div style={{
                      maxWidth:"82%",padding:"10px 14px",
                      borderRadius:msg.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px",
                      background:msg.role==="user"?grad:"white",
                      color:msg.role==="user"?"white":"#0a3020",
                      fontSize:13,lineHeight:1.72,boxShadow:"0 2px 7px rgba(0,0,0,.05)",whiteSpace:"pre-wrap",
                    }}>{msg.content}</div>
                  </div>
                ))}
                {chatLoading&&(
                  <div style={{display:"flex",alignItems:"center",gap:7,color:soft,fontSize:12}}>
                    <img src="/icon-192.png" style={{height:"22px",width:"22px",objectFit:"contain",animation:"float 1.2s infinite"}}/>
                    <span>{t.lexiconLoading}</span>
                  </div>
                )}
                <div ref={chatEndRef}/>
              </div>
              <div style={{padding:"10px 13px",borderTop:`1px solid rgba(200,160,200,.17)`,display:"flex",gap:8,alignItems:"flex-end"}}>
                <textarea value={chatInput} onChange={e=>setChatInput(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&(e.preventDefault(),sendChat())}
                  placeholder={t.chatPlaceholder}
                  rows={2} style={{
                    flex:1,padding:"10px 13px",border:`1.5px solid ${bdr}`,
                    borderRadius:11,background:"rgba(255,255,255,.9)",
                    color:"#0a3020",fontSize:13,fontFamily:"inherit",resize:"none",
                  }}/>
                <button onClick={sendChat} disabled={chatLoading||!chatInput.trim()} style={{
                  padding:"12px 15px",background:grad,border:"none",borderRadius:11,
                  color:"white",cursor:"pointer",fontSize:16,flexShrink:0,
                }}>🕊️</button>
              </div>
            </div>
            <div style={{marginTop:10,display:"flex",flexWrap:"wrap",gap:5}}>
              {t.chatSuggestions.map(s=>(
                <button key={s} className="sugg" onClick={()=>setChatInput(s)} style={{
                  padding:"5px 12px",borderRadius:18,border:`1px solid ${bdr}`,
                  background:"#f8fffd",color:soft,fontSize:10.5,fontFamily:"inherit",
                }}>{s}</button>
              ))}
            </div>
            <TamaraBox lang={lang}/>
          </div>
        )}

        
        {activeTab==="moon" && (
          <div style={{animation:"fadeIn .4s ease"}}>
            <div style={{background:"rgba(255,255,255,.82)",borderRadius:17,padding:20,marginBottom:13,boxShadow:"0 3px 18px rgba(89,184,141,.12)",textAlign:"center"}}>
              <div style={{fontSize:40,marginBottom:8}}>🌙</div>
              <h2 style={{color:"#626160",fontSize:18,fontWeight:"normal",margin:"0 0 6px"}}>
                {lang==="it" ? "Calendario Lunare" : "Mondkalender"}
              </h2>
              <p style={{color:"#59B88D",fontSize:11.5,margin:"0 0 16px"}}>
                {lang==="it" ? "Scopri l'energia di oggi" : "Entdecke die heutige Mondenergie"}
              </p>
              {!moonData && !moonLoading && (
                <button onClick={fetchMoonData} style={{padding:"11px 28px",background:"linear-gradient(135deg,#59B88D,#3F9FFF)",border:"none",borderRadius:25,color:"white",fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>
                  {lang==="it" ? "🌙 Carica calendario" : "🌙 Mondkalender laden"}
                </button>
              )}
              {moonLoading && <p style={{color:"#59B88D"}}>🌙 {lang==="it" ? "Caricamento..." : "Wird geladen..."}</p>}
              {moonData && (
                <div style={{animation:"fadeIn .5s ease"}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
                    {[
                      {icon:"🌙",label:lang==="it"?"Fase":"Phase",val:moonData.phase},
                      {icon:"⭐",label:lang==="it"?"Segno":"Zeichen",val:moonData.signEmoji+" "+moonData.sign},
                      {icon:"🌿",label:lang==="it"?"Qualità":"Qualität",val:moonData.quality},
                      {icon:"🧭",label:lang==="it"?"Direzione":"Richtung",val:moonData.direction},
                    ].map(function(item,i){return (
                      <div key={i} style={{background:"linear-gradient(135deg,rgba(89,184,141,.1),rgba(63,159,255,.1))",borderRadius:12,padding:"12px 10px",border:"1px solid rgba(89,184,141,.3)"}}>
                        <div style={{fontSize:22,marginBottom:4}}>{item.icon}</div>
                        <div style={{fontSize:10,color:"#59B88D",marginBottom:2}}>{item.label}</div>
                        <div style={{fontSize:12,color:"#626160",fontWeight:"bold"}}>{item.val}</div>
                      </div>
                    );})}</div>
                  {moonData.description && (
                    <div style={{background:"rgba(89,184,141,.08)",borderRadius:12,padding:"14px 16px",marginBottom:16,borderLeft:"3px solid #59B88D",textAlign:"left"}}>
                      <p style={{color:"#626160",fontSize:13,lineHeight:1.7,margin:0,fontStyle:"italic"}}>✨ {moonData.description}</p>
                    </div>
                  )}
                  <p style={{color:"#626160",fontSize:12,marginBottom:10,fontWeight:"bold"}}>
                    {lang==="it" ? "Scegli un tema:" : "Wähle ein Thema:"}
                  </p>
                  <div style={{display:"flex",flexWrap:"wrap",gap:7,justifyContent:"center"}}>
                    {(lang==="it"
                      ? ["🏥 Salute","💆 Mente","🌿 Alimentazione","💪 Energia","❤️ Relazioni","🌱 Crescita","😴 Sonno","🧘 Meditazione"]
                      : ["🏥 Gesundheit","💆 Geist & Seele","🌿 Ernaehrung","💪 Energie","❤️ Beziehungen","🌱 Persoenlichkeit","😴 Schlaf","🧘 Meditation"]
                    ).map(function(topic){return (
                      <button key={topic} onClick={function(){getMoonAdvice(topic);}} style={{padding:"7px 13px",borderRadius:20,border:"1.5px solid",borderColor:selectedMoonTopic===topic?"#59B88D":"#b8e8d8",background:selectedMoonTopic===topic?"linear-gradient(135deg,#59B88D,#3F9FFF)":"white",color:selectedMoonTopic===topic?"white":"#626160",fontSize:11.5,cursor:"pointer",fontFamily:"inherit"}}>
                        {topic}
                      </button>
                    );})}
                  </div>
                </div>
              )}
            </div>
            {moonAdviceLoading && <div style={{textAlign:"center",padding:24,color:"#59B88D"}}><div style={{fontSize:28,animation:"spin 2s linear infinite",display:"inline-block"}}>🌙</div><p>{lang==="it"?"Connessione...":"Verbinde..."}</p></div>}
            {moonAdvice && !moonAdviceLoading && (
              <div style={{background:"rgba(255,255,255,.82)",borderRadius:17,padding:22,boxShadow:"0 3px 18px rgba(89,184,141,.12)",animation:"fadeIn .5s ease",borderLeft:"3px solid #59B88D"}}>
                {moonAdvice.split("\n").map(function(line,i){
                  const ml = line.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>");
                  return React.createElement("p",{key:i,dangerouslySetInnerHTML:{__html:ml},style:{margin:"3px 0",lineHeight:1.78,fontSize:13.5,color:"#4a5a4a"}});
                })}
              </div>
            )}
          </div>
        )}

        {activeTab==="body" && (
          <div style={{animation:"fadeIn .4s ease"}}>
            <div style={{background:"rgba(255,255,255,.82)",borderRadius:17,padding:18,marginBottom:13,boxShadow:"0 3px 18px rgba(89,184,141,.12)"}}>
              <div style={{textAlign:"center",marginBottom:16}}>
                <div style={{fontSize:36}}>🏥</div>
                <h2 style={{color:"#626160",fontSize:17,fontWeight:"normal",margin:"6px 0 4px"}}>{lang==="it"?"Mappa Corporea":"Körperkarte"}</h2>
                <p style={{color:"#59B88D",fontSize:11.5,margin:0}}>{lang==="it"?"Clicca una zona del corpo":"Klicke eine Körperregion an"}</p>
              </div>
              <div style={{display:"flex",gap:8,marginBottom:16,background:"rgba(89,184,141,.1)",borderRadius:12,padding:4}}>
                {["front","back"].map(function(v){return (
                  <button key={v} onClick={function(){setBodyView(v);}} style={{flex:1,padding:"8px",border:"none",borderRadius:9,cursor:"pointer",background:bodyView===v?"linear-gradient(135deg,#59B88D,#3F9FFF)":"transparent",color:bodyView===v?"white":"#626160",fontSize:12,fontFamily:"inherit"}}>
                    {v==="front"?(lang==="it"?"👤 Fronte":"👤 Vorne"):(lang==="it"?"🔄 Retro":"🔄 Hinten")}
                  </button>
                );})}
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center"}}>
                {(bodyView==="front"
                  ? (lang==="it"
                    ? ["🧠 Testa","👁️ Occhi","🗣️ Gola","❤️ Petto","🫀 Stomaco","🌀 Pancia","💪 Braccia","🦵 Gambe","👣 Piedi"]
                    : ["🧠 Kopf","👁️ Augen","🗣️ Hals","❤️ Brust & Herz","🫀 Magen","🌀 Bauch","💪 Arme","🦵 Beine","👣 Fuesse"])
                  : (lang==="it"
                    ? ["🔙 Nuca","🦴 Spalle","⬆️ Schiena sup.","⬇️ Schiena inf.","🫘 Reni","🦿 Ginocchia","👂 Orecchie","🦷 Denti","✋ Pelle"]
                    : ["🔙 Nacken","🦴 Schultern","⬆️ Oberer Ruecken","⬇️ Unterer Ruecken","🫘 Nieren","🦿 Knie","👂 Ohren","🦷 Zaehne","✋ Haut"])
                ).map(function(zone){return (
                  <button key={zone} onClick={function(){analyzeBodyPart(zone);}} style={{padding:"10px 14px",borderRadius:12,border:"1.5px solid",borderColor:bodyPart===zone?"#59B88D":"#b8e8d8",background:bodyPart===zone?"linear-gradient(135deg,rgba(89,184,141,.2),rgba(63,159,255,.2))":"white",color:"#626160",fontSize:12,cursor:"pointer",fontFamily:"inherit",minWidth:"42%",textAlign:"left"}}>
                    {zone}
                  </button>
                );})}
              </div>
            </div>
            {bodyLoading && <div style={{textAlign:"center",padding:24,color:"#59B88D"}}><div style={{fontSize:28,animation:"spin 2s linear infinite",display:"inline-block"}}>🏥</div><p>{lang==="it"?"Analisi...":"Analysiere..."}</p></div>}
            {bodyResult && !bodyLoading && (
              <div style={{background:"rgba(255,255,255,.82)",borderRadius:17,padding:22,boxShadow:"0 3px 18px rgba(89,184,141,.12)",animation:"fadeIn .5s ease",borderLeft:"3px solid #59B88D"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                  <span style={{color:"#626160",fontSize:14,fontWeight:"bold"}}>{bodyPart}</span>
                </div>
                {bodyResult.split("\n").map(function(line,i){
                  const bl = line.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>");
                  return React.createElement("p",{key:i,dangerouslySetInnerHTML:{__html:bl},style:{margin:"3px 0",lineHeight:1.78,fontSize:13.5,color:"#4a5a4a"}});
                })}
                <div style={{marginTop:16,paddingTop:14,borderTop:"1px solid rgba(89,184,141,.2)"}}>
                  <p style={{color:"#59B88D",fontSize:11.5,margin:"0 0 8px",fontWeight:"bold"}}>{lang==="it"?"📝 La tua nota:":"📝 Deine Notiz:"}</p>
                  <textarea value={bodyNote} onChange={function(e){setBodyNote(e.target.value);}} placeholder={lang==="it"?"Scrivi le tue riflessioni...":"Schreibe deine Gedanken..."} rows={3} style={{width:"100%",padding:"10px 13px",border:"1.5px solid #b8e8d8",borderRadius:11,background:"rgba(255,255,255,.9)",color:"#626160",fontSize:13,fontFamily:"inherit",resize:"vertical",boxSizing:"border-box"}}/>
                </div>
              </div>
            )}
          </div>
        )}


        {activeTab==="journal" && (
          <div style={{animation:"fadeIn .4s ease"}}>

            {/* NOT LOGGED IN */}
            {!user && (
              <div style={{background:"rgba(255,255,255,.82)",borderRadius:17,padding:24,boxShadow:"0 3px 18px rgba(89,184,141,.12)",textAlign:"center"}}>
                <div style={{fontSize:40,marginBottom:10}}>🔐</div>
                <h2 style={{color:"#626160",fontSize:17,fontWeight:"normal",margin:"0 0 8px"}}>
                  {lang==="it" ? "Accedi al tuo spazio" : "Melde dich an"}
                </h2>
                <p style={{color:"#59B88D",fontSize:12,margin:"0 0 20px"}}>
                  {lang==="it" ? "Salva le tue analisi e il tuo diario" : "Speichere deine Analysen und dein Tagebuch"}
                </p>
                {/* Google Login Button */}
                <button onClick={signInWithGoogle} disabled={authLoading} style={{
                  width:"100%",padding:"13px",
                  background:"white",border:"1.5px solid #e0e0e0",
                  borderRadius:11,color:"#626160",fontSize:14,
                  cursor:"pointer",fontFamily:"inherit",
                  display:"flex",alignItems:"center",justifyContent:"center",gap:10,
                  boxShadow:"0 2px 8px rgba(0,0,0,.08)",marginBottom:12
                }}>
                  <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                  </svg>
                  {authLoading ? "⏳ ..." : (lang==="it"?"Accedi con Google":"Mit Google anmelden")}
                </button>

                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                  <div style={{flex:1,height:1,background:"#e0e0e0"}}/>
                  <span style={{color:"#aaa",fontSize:11}}>{lang==="it"?"oppure":"oder"}</span>
                  <div style={{flex:1,height:1,background:"#e0e0e0"}}/>
                </div>

                <div style={{display:"flex",gap:8,marginBottom:12,background:"rgba(89,184,141,.1)",borderRadius:12,padding:4}}>
                  {["login","signup"].map(function(m){return (
                    <button key={m} onClick={function(){setAuthMode(m); setAuthError("");}} style={{flex:1,padding:"8px",border:"none",borderRadius:9,cursor:"pointer",background:authMode===m?"linear-gradient(135deg,#59B88D,#3F9FFF)":"transparent",color:authMode===m?"white":"#626160",fontSize:12,fontFamily:"inherit"}}>
                      {m==="login" ? (lang==="it"?"🔑 Email":"🔑 Email") : (lang==="it"?"✨ Registrati":"✨ Registrieren")}
                    </button>
                  );})}
                </div>
                <input type="email" value={authEmail} onChange={function(e){setAuthEmail(e.target.value);}}
                  placeholder="Email" style={{width:"100%",padding:"11px 14px",border:"1.5px solid #b8e8d8",borderRadius:11,marginBottom:10,fontSize:13,fontFamily:"inherit",boxSizing:"border-box",background:"white",color:"#626160"}}/>
                <input type="password" value={authPassword} onChange={function(e){setAuthPassword(e.target.value);}}
                  placeholder={lang==="it"?"Password":"Passwort"} style={{width:"100%",padding:"11px 14px",border:"1.5px solid #b8e8d8",borderRadius:11,marginBottom:12,fontSize:13,fontFamily:"inherit",boxSizing:"border-box",background:"white",color:"#626160"}}/>
                {authError && <p style={{color:"#e53935",fontSize:12,marginBottom:10}}>{authError}</p>}
                <button onClick={signIn} disabled={authLoading} style={{width:"100%",padding:"12px",background:"linear-gradient(135deg,#59B88D,#3F9FFF)",border:"none",borderRadius:11,color:"white",fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>
                  {authLoading ? "⏳ ..." : (authMode==="login" ? (lang==="it"?"Accedi":"Anmelden") : (lang==="it"?"Registrati":"Registrieren"))}
                </button>
                {authMode==="signup" && <p style={{color:"#59B88D",fontSize:11,marginTop:10}}>{lang==="it"?"Dopo la registrazione controlla la tua email":"Nach der Registrierung bitte Email bestätigen"}</p>}
              </div>
            )}

            {/* LOGGED IN */}
            {user && (
              <div>
                {/* Header */}
                <div style={{background:"rgba(255,255,255,.82)",borderRadius:17,padding:"14px 18px",marginBottom:12,boxShadow:"0 3px 18px rgba(89,184,141,.12)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <div>
                    <p style={{margin:0,fontSize:12,color:"#59B88D",fontWeight:"bold"}}>✅ {lang==="it"?"Connesso come":"Angemeldet als"}</p>
                    <p style={{margin:0,fontSize:11,color:"#626160"}}>{user.email}</p>
                  </div>
                  <button onClick={signOut} style={{padding:"6px 14px",background:"none",border:"1.5px solid #b8e8d8",borderRadius:20,color:"#626160",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
                    {lang==="it"?"Esci":"Abmelden"}
                  </button>
                </div>

                {/* Sub-tabs */}
                <div style={{display:"flex",gap:6,marginBottom:12,background:"rgba(255,255,255,.5)",borderRadius:13,padding:5}}>
                  {[
                    {id:"analyses",label:lang==="it"?"💾 Analisi salvate":"💾 Gespeicherte Analysen"},
                    {id:"diary",label:lang==="it"?"📖 Diario":"📖 Tagebuch"}
                  ].map(function(st){return (
                    <button key={st.id} onClick={function(){setJournalTab(st.id); if(st.id==="analyses")loadAnalyses(); else loadDiary();}} style={{flex:1,padding:"9px 5px",border:"none",borderRadius:9,cursor:"pointer",background:journalTab===st.id?"linear-gradient(135deg,#59B88D,#3F9FFF)":"transparent",color:journalTab===st.id?"white":"#626160",fontSize:11.5,fontFamily:"inherit",fontWeight:journalTab===st.id?"bold":"normal"}}>
                      {st.label}
                    </button>
                  );})}
                </div>

                {/* ANALYSES */}
                {journalTab==="analyses" && (
                  <div>
                    <button onClick={loadAnalyses} style={{width:"100%",padding:"10px",background:"rgba(89,184,141,.1)",border:"1px solid #b8e8d8",borderRadius:11,color:"#59B88D",fontSize:12,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>
                      🔄 {lang==="it"?"Aggiorna":"Aktualisieren"}
                    </button>
                    {analyses.length===0 && (
                      <div style={{textAlign:"center",padding:30,color:"#59B88D",fontSize:13}}>
                        {lang==="it"?"Nessuna analisi salvata ancora":"Noch keine gespeicherten Analysen"}
                      </div>
                    )}
                    {analyses.map(function(a){return (
                      <div key={a.id} style={{background:"rgba(255,255,255,.82)",borderRadius:14,padding:16,marginBottom:10,boxShadow:"0 2px 10px rgba(89,184,141,.1)",borderLeft:"3px solid #59B88D"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                          <span style={{fontWeight:"bold",color:"#626160",fontSize:14}}>{a.topic}</span>
                          <span style={{fontSize:10,color:"#59B88D"}}>{new Date(a.created_at).toLocaleDateString()}</span>
                        </div>
                        <p style={{fontSize:12,color:"#626160",lineHeight:1.6,margin:"0 0 8px",whiteSpace:"pre-wrap"}}>{a.result.substring(0,300)}...</p>
                        {a.note && <p style={{fontSize:11.5,color:"#59B88D",fontStyle:"italic",margin:"0 0 8px"}}>📝 {a.note}</p>}
                        <button onClick={function(){deleteAnalysis(a.id);}} style={{padding:"4px 12px",background:"none",border:"1px solid #ffb3b3",borderRadius:10,color:"#e53935",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
                          🗑️ {lang==="it"?"Elimina":"Löschen"}
                        </button>
                      </div>
                    );})}
                  </div>
                )}

                {/* DIARY */}
                {journalTab==="diary" && (
                  <div>
                    {/* New entry */}
                    <div style={{background:"rgba(255,255,255,.82)",borderRadius:14,padding:16,marginBottom:12,boxShadow:"0 2px 10px rgba(89,184,141,.1)"}}>
                      <p style={{color:"#59B88D",fontSize:12,fontWeight:"bold",margin:"0 0 10px"}}>
                        ✍️ {lang==="it"?"Nuovo appunto:":"Neuer Tagebucheintrag:"}
                      </p>
                      <input value={diaryTitle} onChange={function(e){setDiaryTitle(e.target.value);}}
                        placeholder={lang==="it"?"Titolo (opzionale)":"Titel (optional)"}
                        style={{width:"100%",padding:"9px 12px",border:"1.5px solid #b8e8d8",borderRadius:10,marginBottom:8,fontSize:13,fontFamily:"inherit",boxSizing:"border-box",background:"white",color:"#626160"}}/>
                      <textarea value={diaryContent} onChange={function(e){setDiaryContent(e.target.value);}}
                        placeholder={lang==="it"?"Scrivi le tue riflessioni, intuizioni, esperienze...":"Schreibe deine Erkenntnisse, Gedanken, Erfahrungen..."}
                        rows={4} style={{width:"100%",padding:"9px 12px",border:"1.5px solid #b8e8d8",borderRadius:10,marginBottom:10,fontSize:13,fontFamily:"inherit",resize:"vertical",boxSizing:"border-box",background:"white",color:"#626160"}}/>
                      <button onClick={saveDiary} disabled={diaryLoading || !diaryContent.trim()} style={{width:"100%",padding:"10px",background:diaryContent.trim()?"linear-gradient(135deg,#59B88D,#3F9FFF)":"#ccc",border:"none",borderRadius:11,color:"white",fontSize:13,cursor:diaryContent.trim()?"pointer":"default",fontFamily:"inherit"}}>
                        {diaryLoading ? "⏳..." : "💾 " + (lang==="it"?"Salva appunto":"Eintrag speichern")}
                      </button>
                    </div>

                    {/* Diary entries */}
                    <button onClick={loadDiary} style={{width:"100%",padding:"10px",background:"rgba(89,184,141,.1)",border:"1px solid #b8e8d8",borderRadius:11,color:"#59B88D",fontSize:12,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>
                      🔄 {lang==="it"?"Aggiorna":"Aktualisieren"}
                    </button>
                    {diaryEntries.length===0 && (
                      <div style={{textAlign:"center",padding:30,color:"#59B88D",fontSize:13}}>
                        {lang==="it"?"Nessun appunto ancora":"Noch keine Einträge"}
                      </div>
                    )}
                    {diaryEntries.map(function(d){return (
                      <div key={d.id} style={{background:"rgba(255,255,255,.82)",borderRadius:14,padding:16,marginBottom:10,boxShadow:"0 2px 10px rgba(89,184,141,.1)",borderLeft:"3px solid #43D3FF"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                          <span style={{fontWeight:"bold",color:"#626160",fontSize:13}}>{d.title || (lang==="it"?"Appunto":"Eintrag")}</span>
                          <span style={{fontSize:10,color:"#59B88D"}}>{new Date(d.created_at).toLocaleDateString()}</span>
                        </div>
                        <p style={{fontSize:12.5,color:"#626160",lineHeight:1.7,margin:"0 0 8px",whiteSpace:"pre-wrap"}}>{d.content}</p>
                        <button onClick={function(){deleteDiary(d.id);}} style={{padding:"4px 12px",background:"none",border:"1px solid #ffb3b3",borderRadius:10,color:"#e53935",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
                          🗑️ {lang==="it"?"Elimina":"Löschen"}
                        </button>
                      </div>
                    );})}
                  </div>
                )}
              </div>
            )}
          </div>
        )}

<div style={{textAlign:"center",marginTop:20}}>
          <a href="https://www.tamarajost.com" target="_blank" rel="noopener noreferrer"
            style={{color:"#59B88D",fontSize:10.5,textDecoration:"none",letterSpacing:.5}}>
            tamarajost.com
          </a>
          <span style={{color:"#59B88D",fontSize:10.5}}> · </span>
          <a href="https://tamarajost.com/produkt/yagercodesession/" target="_blank" rel="noopener noreferrer" style={{color:"#59B88D",fontSize:10.5,textDecoration:"none"}}>Yager Code</a>
          <span style={{color:"#59B88D",fontSize:10.5}}> · </span>
          <a href="https://tamarajost.com/bist-du-wirklich-bereit-fuer-eine-veraenderung/" target="_blank" rel="noopener noreferrer" style={{color:"#59B88D",fontSize:10.5,textDecoration:"none"}}>Coaching</a>
          <span style={{color:"#59B88D",fontSize:10.5}}> · </span>
          <a href="https://tamarajost.com/silent-subliminal-2/" target="_blank" rel="noopener noreferrer" style={{color:"#59B88D",fontSize:10.5,textDecoration:"none"}}>Silent Subliminals</a>
          <span style={{color:"#59B88D",fontSize:10.5}}> · </span>
          <a href="https://tamarajost.com/buecher/" target="_blank" rel="noopener noreferrer" style={{color:"#59B88D",fontSize:10.5,textDecoration:"none"}}>Bücher</a>
          <span style={{color:"#59B88D",fontSize:10.5}}> · </span>
          <a href="https://tamarajost.com/datenschutz-healingapp/" target="_blank" rel="noopener noreferrer" style={{color:"#59B88D",fontSize:10.5,textDecoration:"none"}}>
            {lang==="it" ? "Privacy" : "Datenschutz"}
          </a>
          <span style={{color:"#59B88D",fontSize:10.5}}> · </span>
          <a href="https://tamarajost.com/datenschutz-healingapp/" target="_blank" rel="noopener noreferrer" style={{color:"#59B88D",fontSize:10.5,textDecoration:"none"}}>
            {lang==="it" ? "Termini di utilizzo" : "Nutzungsbedingungen"}
          </a>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
